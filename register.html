<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | KumbhPark – Smart Parking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-box">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="brand-icon">🅿</div>
          <div class="brand-info" style="text-align:left">
            <h2 style="font-size:22px">Kumbh<span style="color:var(--accent)">Park</span></h2>
            <p style="font-size:10px;color:var(--text-muted)">Smart Parking System</p>
          </div>
        </a>
        <h2>Join KumbhPark</h2>
        <p>Select your account role to get started.</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px">
        <a href="customer-register.html" class="dashboard-panel" style="margin-bottom:0;text-align:center;padding:22px 14px;border:2px solid var(--primary);background:var(--primary-subtle);cursor:pointer;display:block">
          <div style="font-size:32px;margin-bottom:8px">🚗</div>
          <strong style="color:var(--primary);font-size:15px;display:block">Visitor / Pilgrim</strong>
          <span style="font-size:11px;color:var(--text-muted)">Book slots & view passes</span>
        </a>
        <a href="provider-register.html" class="dashboard-panel" style="margin-bottom:0;text-align:center;padding:22px 14px;border:2px solid var(--accent);background:var(--accent-subtle);cursor:pointer;display:block">
          <div style="font-size:32px;margin-bottom:8px">🛡️</div>
          <strong style="color:var(--accent-dark);font-size:15px;display:block">Parking Provider</strong>
          <span style="font-size:11px;color:var(--text-muted)">Manage parking grounds</span>
        </a>
      </div>

      <div style="text-align:center;font-size:13px;color:var(--text-muted)">
        Already have an account? 
        <a href="customer-login.html" style="color:var(--primary);font-weight:600">Visitor Login</a> • 
        <a href="provider-login.html" style="color:var(--accent-dark);font-weight:600">Provider Login</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
</body>
</html>
