<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Bookings | KumbhPark – Smart Parking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" id="appShell">
    <main class="app-main" id="appMain">
      <div class="page-body">

        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px">
          <div>
            <h2 style="font-size:24px">Customer Bookings in Your Zones</h2>
            <p style="font-size:13px;color:var(--text-muted);margin-top:2px">
              Real-time reservations, vehicle arrivals and occupied slot logs for your facilities.
            </p>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn-secondary" onclick="window.print()">🖨️ Export / Print</button>
          </div>
        </div>

        <div class="dashboard-panel">
          <div class="table-responsive">
            <table class="modern-table">
              <thead>
                <tr>
                  <th>Pass ID</th>
                  <th>Customer Name</th>
                  <th>Vehicle Number</th>
                  <th>Parking Zone</th>
                  <th>Slot Bay</th>
                  <th>Booking Date</th>
                  <th>Duration</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="providerBookingsList">
                <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted)">Loading bookings...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script>
    const user = requireRole("provider");

    async function initProviderBookings() {
      if (!user) return;

      renderAppShell({
        title: "All Bookings",
        activeKey: "provider-bookings",
        subtitle: "Customer Passes"
      });

      try {
        const bookings = await api(`/api/providers/${user.id}/bookings`);
        const tbody = document.getElementById("providerBookingsList");

        if (!bookings.length) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">No bookings recorded for your parking zones yet.</td></tr>';
          return;
        }

        tbody.innerHTML = bookings.map(b => {
          const normStatus = (b.status || "Confirmed").toLowerCase();
          return `
            <tr>
              <td><b style="color:var(--primary);font-family:monospace">${escapeHtml(b.booking_code || ("KP" + b.id))}</b></td>
              <td><b>${escapeHtml(b.customer_name || "Pilgrim")}</b></td>
              <td>${escapeHtml(b.vehicle_number)} (${escapeHtml(b.vehicle_type)})</td>
              <td>${escapeHtml(b.zone_name)}</td>
              <td>
                <span style="font-family:monospace;font-weight:700;padding:2px 8px;border-radius:4px;background:#f1f5f9;color:var(--primary)">
                  ${escapeHtml(b.slot_number)}
                </span>
              </td>
              <td>${escapeHtml(b.booking_date)}</td>
              <td>${escapeHtml(b.duration)}</td>
              <td><span class="status-tag ${normStatus}">${escapeHtml(b.status)}</span></td>
            </tr>
          `;
        }).join("");

      } catch (err) {
        document.getElementById("providerBookingsList").innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted)">Unable to load bookings.</td></tr>';
      }
    }

    initProviderBookings();
  </script>
</body>
</html>
