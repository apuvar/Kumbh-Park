<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | KumbhPark – Smart Parking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" id="appShell">
    <main class="app-main" id="appMain">
      <div class="page-body">

        <div style="max-width:800px;margin:0 auto">
          <!-- Profile Card -->
          <div class="dashboard-panel" style="padding:28px">
            <div style="display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--border-light);padding-bottom:24px;margin-bottom:24px">
              <div class="user-avatar" id="profileBigAvatar" style="width:72px;height:72px;font-size:28px">
                ?
              </div>
              <div style="flex:1">
                <div style="display:flex;align-items:center;gap:10px">
                  <h2 id="profileName" style="font-size:24px">Loading...</h2>
                  <span id="profileRoleBadge" class="sidebar-role-badge customer">Account</span>
                </div>
                <p id="profileEmail" style="color:var(--text-muted);font-size:13px;margin-top:2px">
                  —
                </p>
              </div>
              <button onclick="logout()" class="btn-danger">
                🚪 Logout
              </button>
            </div>

            <!-- Account Details Form -->
            <form id="profileForm">
              <h3 style="font-size:17px;margin-bottom:16px">Account Information</h3>
              <div class="form-grid-2">
                <div class="form-group">
                  <label>Full Name</label>
                  <input type="text" id="profNameInput" class="form-control" required>
                </div>
                <div class="form-group">
                  <label>Email Address</label>
                  <input type="email" id="profEmailInput" class="form-control" readonly style="background:#f1f5f9;cursor:not-allowed">
                </div>
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label>Mobile Number</label>
                  <input type="tel" id="profMobileInput" class="form-control" maxlength="10" required>
                </div>
                <div class="form-group" id="vehicleFieldGroup">
                  <label>Registered Vehicle Number</label>
                  <input type="text" id="profVehicleInput" class="form-control" style="text-transform:uppercase" placeholder="e.g. MH15AB1234">
                </div>
                <div class="form-group" id="orgFieldGroup" style="display:none">
                  <label>Organization</label>
                  <input type="text" id="profOrgInput" class="form-control" readonly style="background:#f1f5f9;cursor:not-allowed">
                </div>
              </div>

              <div style="display:flex;justify-content:flex-end;margin-top:10px">
                <button type="submit" class="btn-primary" style="padding:11px 24px">
                  💾 Save Profile Changes
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script>
    let user = getUser();

    async function initProfile() {
      if (!user) {
        location.replace("login.html?redirect=profile.html");
        return;
      }

      renderAppShell({
        title: "User Profile",
        activeKey: "profile",
        subtitle: "Account Details"
      });

      // Refresh profile from database using authenticated session identity
      try {
        const res = await api(`/api/auth/profile?id=${user.id}&role=${user.role}`);
        if (res.user) {
          user = { ...user, ...res.user, role: user.role };
          saveUser(user);
        }
      } catch (err) {
        console.warn("Could not refresh profile from server:", err.message);
      }

      document.getElementById("profileBigAvatar").textContent = (user.name || "U")[0].toUpperCase();
      document.getElementById("profileName").textContent = user.name || "User";
      document.getElementById("profileEmail").textContent = user.email || "";

      const badge = document.getElementById("profileRoleBadge");
      if (user.role === "provider") {
        badge.className = "sidebar-role-badge provider";
        badge.textContent = "🛡️ Parking Provider";
        document.getElementById("vehicleFieldGroup").style.display = "none";
        document.getElementById("orgFieldGroup").style.display = "block";
        document.getElementById("profOrgInput").value = user.organization_name || "";
      } else {
        badge.className = "sidebar-role-badge customer";
        badge.textContent = "🚗 Visitor / Customer";
      }

      document.getElementById("profNameInput").value = user.name || "";
      document.getElementById("profEmailInput").value = user.email || "";
      document.getElementById("profMobileInput").value = user.mobile || "";
      document.getElementById("profVehicleInput").value = user.vehicle_number || "";

      document.getElementById("profileForm").onsubmit = (e) => {
        e.preventDefault();
        const updated = {
          ...user,
          name: document.getElementById("profNameInput").value.trim(),
          mobile: document.getElementById("profMobileInput").value.trim(),
          vehicle_number: document.getElementById("profVehicleInput").value.trim().toUpperCase()
        };
        saveUser(updated);
        user = updated;
        document.getElementById("profileName").textContent = updated.name;
        document.getElementById("profileBigAvatar").textContent = (updated.name || "U")[0].toUpperCase();
        showToast("Profile updated successfully!", "success");
      };
    }

    initProfile();
  </script>
</body>
</html>
