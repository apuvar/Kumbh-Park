<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Parking Zone | KumbhPark – Smart Parking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" id="appShell">
    <main class="app-main" id="appMain">
      <div class="page-body">

        <div style="max-width:720px;margin:20px auto">
          <div class="dashboard-panel" style="padding:32px">
            <div style="margin-bottom:24px;border-bottom:1px solid var(--border-light);padding-bottom:18px">
              <span class="status-tag" style="background:var(--accent-subtle);color:var(--accent-dark);margin-bottom:6px">📍 FACILITY ONBOARDING</span>
              <h2 style="font-size:24px">Register New Parking Zone</h2>
              <p style="font-size:13px;color:var(--text-muted);margin-top:2px">
                Provide zone location, total bay capacity, and standard parking rates.
              </p>
            </div>

            <div id="zoneAlert"></div>

            <form id="addZoneForm">
              <div class="form-group">
                <label>Parking Zone Name *</label>
                <input type="text" id="zoneName" class="form-control" placeholder="e.g. Zone E – Muktidham Ghat" required>
              </div>

              <div class="form-group">
                <label>Physical Location / Landmark Address *</label>
                <input type="text" id="zoneLocation" class="form-control" placeholder="Near Muktidham Temple, Nashik Road" required>
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label>Total Space Capacity *</label>
                  <input type="number" id="zoneCapacity" class="form-control" placeholder="200" min="10" required>
                </div>
                <div class="form-group">
                  <label>Standard Hourly Rate (₹ / hour) *</label>
                  <input type="number" id="zoneRate" class="form-control" placeholder="30" min="5" required>
                </div>
              </div>

              <div class="form-group">
                <label>Distance to Nearest Ghat</label>
                <input type="text" id="zoneDistance" class="form-control" placeholder="e.g. 1.5 km from Ramkund">
              </div>

              <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px">
                <a href="provider-zones.html" class="btn-secondary" style="padding:11px 20px">Cancel</a>
                <button type="submit" class="btn-primary" style="padding:11px 26px">
                  Save & Register Zone →
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script>
    const user = requireRole("provider");

    function initAddZone() {
      if (!user) return;

      renderAppShell({
        title: "Add Parking Zone",
        activeKey: "add-zone",
        subtitle: "New Facility"
      });

      document.getElementById("addZoneForm").onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
          zone_name: document.getElementById("zoneName").value.trim(),
          name: document.getElementById("zoneName").value.trim(),
          location: document.getElementById("zoneLocation").value.trim(),
          capacity: Number(document.getElementById("zoneCapacity").value),
          available_slots: Number(document.getElementById("zoneCapacity").value),
          available: Number(document.getElementById("zoneCapacity").value),
          rate: Number(document.getElementById("zoneRate").value),
          distance: document.getElementById("zoneDistance").value.trim() || "1.0 km away"
        };

        const submitBtn = e.target.querySelector('button[type="submit"]');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = "Saving Zone...";
        }

        try {
          const res = await api(`/api/providers/${user.id}/zones`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          showToast(`Zone "${res.zone?.zone_name || payload.zone_name}" added successfully!`, "success");
          setTimeout(() => location.href = "provider-zones.html", 400);
        } catch (err) {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Save & Register Zone →";
          }
          document.getElementById("zoneAlert").innerHTML = `<div class="alert-message error">${escapeHtml(err.message || "Failed to add zone")}</div>`;
        }
      };
    }

    initAddZone();
  </script>
</body>
</html>
